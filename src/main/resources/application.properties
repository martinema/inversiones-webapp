# Configuración de la Base de Datos MySQL
spring.datasource.url=jdbc:mysql://192.168.1.42:3306/Inversiones?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=miguel
spring.datasource.password=MMAProyectos01%
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Puerto de la aplicación
server.port=8080

# Contexto de la aplicación
server.servlet.context-path=/inversiones

# Configuración de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.root=INFO
logging.level.com.inversiones=DEBUG
