<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Tipo de Rendimiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:include="menu :: styles"></th:block>
    <style>
.form-container {
	background: white;
	border-radius: 10px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
	padding: 30px;
	max-width: 600px;
}

h1 {
	color: #667eea;
	margin-bottom: 30px;
}

.btn-guardar {
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	border: none;
	color: white;
	font-weight: bold;
	width: 100%;
}

.btn-guardar:hover {
	background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
	color: white;
}

.btn-volver {
	background: #6c757d;
	color: white;
	width: 100%;
}

@media (max-width: 768px) {
	.form-container {
		padding: 20px;
		max-width: 100%;
	}
	
	h1 {
		font-size: 22px;
		margin-bottom: 20px;
	}
}

@media (max-width: 576px) {
	.form-container {
		padding: 15px;
	}
	
	h1 {
		font-size: 18px;
	}
}
    </style>
</head>
<body>
	<!-- Sidebar -->
	<div th:include="menu :: sidebar" class="sidebar"></div>

	<!-- Content -->
	<div class="content">
		<div class="form-container">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<h1>📝 Tipo de Rendimiento</h1>
			</div>
        
        <form th:action="@{/tipoRendimiento/guardar}" method="POST" th:object="${tipoRendimiento}">
            <input type="hidden" th:field="*{id}">
            
            <div class="mb-3">
                <label for="tipo" class="form-label">Tipo de Rendimiento *</label>
                <input type="text" class="form-control" id="tipo" th:field="*{tipo}" placeholder="Ej: Interés, Dividendo..." required>
            </div>
            
            <div class="mb-3">
                <label for="periodo" class="form-label">Período (en meses) *</label>
                <input type="number" class="form-control" id="periodo" th:field="*{periodo}" 
                       min="1" step="1" placeholder="Ej: 1, 3, 6, 12..." required
                       title="Ingrese cada cuántos meses se calcula el rendimiento">
                <small class="form-text text-muted">Indica cada cuántos meses se calcula y distribuye el rendimiento</small>
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-guardar">💾 Guardar</button>
                <a href="/inversiones/tipoRendimiento" class="btn btn-volver">Cancelar</a>
            </div>
        </form>
		</div>
	</div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Sidebar Toggle Script -->
    <script>
    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        if (sidebar) {
            sidebar.classList.toggle('active');
            if (overlay) overlay.classList.toggle('active');
            if (window.innerWidth <= 768) {
                if (sidebar.classList.contains('active')) {
                    document.body.style.overflow = 'hidden';
                    document.addEventListener('click', closeOnClickOutside);
                } else {
                    document.body.style.overflow = 'auto';
                    document.removeEventListener('click', closeOnClickOutside);
                }
            }
        }
    }
    function closeOnClickOutside(event) {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        const toggleOpen = document.querySelector('.sidebar-toggle-open');
        const toggleClose = document.querySelector('.sidebar-toggle-close');
        if (sidebar && !sidebar.contains(event.target) && !toggleOpen.contains(event.target) && !toggleClose.contains(event.target)) {
            sidebar.classList.remove('active');
            if (overlay) overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
            document.removeEventListener('click', closeOnClickOutside);
        }
    }
    document.addEventListener('DOMContentLoaded', function() {
        if (window.innerWidth <= 768) {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar) {
                sidebar.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }
        const sidebarLinks = document.querySelectorAll('.sidebar-menu a');
        sidebarLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    const sidebar = document.querySelector('.sidebar');
                    if (sidebar) {
                        sidebar.classList.remove('active');
                        document.body.style.overflow = 'auto';
                        document.removeEventListener('click', closeOnClickOutside);
                    }
                }
            });
        });
        window.addEventListener('resize', function() {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar && window.innerWidth > 768) {
                sidebar.classList.remove('active');
                document.body.style.overflow = 'auto';
                document.removeEventListener('click', closeOnClickOutside);
            }
        });
    });
    </script>
</body>
</html>
