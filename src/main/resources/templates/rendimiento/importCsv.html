<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importar CSV</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<th:block th:include="menu :: styles"></th:block>
<style>
.form-container {
	background: white;
	border-radius: 10px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
	padding: 30px;
	max-width: 900px;
}

h1 {
	color: #667eea;
	margin-bottom: 30px;
}

.btn-guardar {
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	border: none;
	color: white;
	font-weight: bold;
	width: 100%;
}

.btn-guardar:hover {
	background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
	color: white;
}

.error {
	margin-top: 20px;
	padding: 15px;
	background-color: #f8d7da;
	border: 1px solid #f5c6cb;
	border-radius: 5px;
	color: #721c24;
}

.success {
	margin-top: 20px;
	padding: 15px;
	background-color: #d4edda;
	border: 1px solid #c3e6cb;
	border-radius: 5px;
	color: #155724;
}

@media (max-width: 768px) {
	.form-container {
		padding: 20px;
		max-width: 100%;
	}
	
	h1 {
		font-size: 22px;
		margin-bottom: 20px;
	}
}

@media (max-width: 576px) {
	.form-container {
		padding: 15px;
	}
	
	h1 {
		font-size: 18px;
	}
}
</style>
</head>
<body>
	<!-- Navigation Bar -->
	<div th:include="menu :: sidebar"></div>

	<!-- Content -->
	<div class="content">
		<div class="form-container">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<h1>💼 Importar CSV</h1>
			</div>

			<form th:action="@{/api/rendimiento/importar-csv}" method="POST"
				enctype="multipart/form-data">
				<div class="row">
					<div class="col-md-6 mb-3">
						<label for="csvFile" class="form-label">Archivo CSV:</label> <input
							type="file" id="csvFile" name="csvFile" accept=".csv"
							class="form-control" required>
					</div>
				</div>
				<div class="row">
					<div class="col-md-6 mb-3">
						<button type="submit" class="btn btn-guardar">Importar</button>
					</div>
				</div>
			</form>

			<div th:if="${error}" class="error">
				<p th:text="${error}"></p>
			</div>

			<div th:if="${success}" class="success">
				<p th:text="${success}"></p>
			</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
	
	<!-- Sidebar Toggle Script -->
	<script>
	function toggleSidebar() {
		const sidebar = document.querySelector('.sidebar');
		const overlay = document.querySelector('.sidebar-overlay');
		if (sidebar) {
			sidebar.classList.toggle('active');
			if (overlay) overlay.classList.toggle('active');
			if (window.innerWidth <= 768) {
				if (sidebar.classList.contains('active')) {
					document.body.style.overflow = 'hidden';
					document.addEventListener('click', closeOnClickOutside);
				} else {
					document.body.style.overflow = 'auto';
					document.removeEventListener('click', closeOnClickOutside);
				}
			}
		}
	}
	function closeOnClickOutside(event) {
		const sidebar = document.querySelector('.sidebar');
		const overlay = document.querySelector('.sidebar-overlay');
		const toggleOpen = document.querySelector('.sidebar-toggle-open');
		const toggleClose = document.querySelector('.sidebar-toggle-close');
		if (sidebar && !sidebar.contains(event.target) && !toggleOpen.contains(event.target) && !toggleClose.contains(event.target)) {
			sidebar.classList.remove('active');
			if (overlay) overlay.classList.remove('active');
			document.body.style.overflow = 'auto';
			document.removeEventListener('click', closeOnClickOutside);
		}
	}
	document.addEventListener('DOMContentLoaded', function() {
		if (window.innerWidth <= 768) {
			const sidebar = document.querySelector('.sidebar');
			if (sidebar) {
				sidebar.classList.remove('active');
				document.body.style.overflow = 'auto';
			}
		}
		const sidebarLinks = document.querySelectorAll('.sidebar-menu a');
		sidebarLinks.forEach(link => {
			link.addEventListener('click', function(e) {
				if (window.innerWidth <= 768) {
					const sidebar = document.querySelector('.sidebar');
					if (sidebar) {
						sidebar.classList.remove('active');
						document.body.style.overflow = 'auto';
						document.removeEventListener('click', closeOnClickOutside);
					}
				}
			});
		});
		window.addEventListener('resize', function() {
			const sidebar = document.querySelector('.sidebar');
			if (sidebar && window.innerWidth > 768) {
				sidebar.classList.remove('active');
				document.body.style.overflow = 'auto';
				document.removeEventListener('click', closeOnClickOutside);
			}
		});
	});
	</script>
</body>
</html>
