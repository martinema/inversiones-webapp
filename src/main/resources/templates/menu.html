<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
	<!-- Sidebar Menu Fragment -->
	<div th:fragment="sidebar" class="sidebar">
		<h2>📊 Menú</h2>
		<ul class="sidebar-menu">
			<li><a href="/inversiones/">🏠 Inicio</a></li>
			<li><a href="/inversiones/proyecto">📋 Proyectos</a></li>
<!-- 			<li><a href="/inversiones/proyecto/importCsv">📥 Importar CSV</a></li> -->
			<li><a href="/inversiones/rendimiento">📈 Rendimientos</a></li>
			<li><a href="/inversiones/tipoRendimiento">🏷️ Tipos de Rendimiento</a></li>
		</ul>
	</div>

	<!-- Sidebar Styles Fragment -->
	<th:block th:fragment="styles">
    <style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	background-color: #f5f5f5;
	display: flex;
	min-height: 100vh;
}

.sidebar {
	width: 300px;
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	padding: 20px 0;
	box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
	position: fixed;
	height: 100vh;
	overflow-y: auto;
}

.sidebar h2 {
	color: white;
	padding: 20px;
	font-size: 20px;
	margin-bottom: 20px;
	border-bottom: 2px solid rgba(255, 255, 255, 0.3);
}

.sidebar-menu {
	list-style: none;
}

.sidebar-menu li {
	margin: 10px 0;
}

.sidebar-menu a {
	color: white;
	text-decoration: none;
	display: block;
	padding: 15px 20px;
	transition: all 0.3s;
	font-weight: 500;
	border-left: 4px solid transparent;
}

.sidebar-menu a:hover {
	background-color: rgba(255, 255, 255, 0.2);
	border-left-color: white;
	padding-left: 25px;
}

.content {
	margin-left: 300px;
	flex: 1;
	padding: 20px;
}

.container-main {
	background: white;
	border-radius: 10px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
	padding: 40px;
}

h1 {
	color: #667eea;
	margin-bottom: 30px;
	text-align: center;
}

.card-menu {
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	color: white;
	border: none;
	margin: 15px 0;
	cursor: pointer;
	transition: transform 0.3s;
}

.card-menu:hover {
	transform: translateY(-5px);
	box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
}

.card-menu a {
	color: white;
	text-decoration: none;
	display: block;
	padding: 20px;
	font-size: 18px;
	font-weight: bold;
}
    </style>
	</th:block>
</body>
</html>
