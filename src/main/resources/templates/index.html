<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversiones - Sistema de Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:include="menu :: styles"></th:block>
    <style>
h1 {
	color: #667eea;
	margin-bottom: 30px;
	text-align: center;
}

.card-menu {
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	color: white;
	border: none;
	margin: 15px 0;
	cursor: pointer;
	transition: transform 0.3s;
}

.card-menu:hover {
	transform: translateY(-5px);
	box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
}

.card-menu a {
	color: white;
	text-decoration: none;
	display: block;
	padding: 20px;
	font-size: 18px;
	font-weight: bold;
}
    </style>
</head>
<body>
	<!-- Sidebar -->
	<div th:include="menu :: sidebar" class="sidebar"></div>

	<!-- Content -->
	<div class="content">
		<div class="container-main">
			<h1>🏢 Sistema de Gestión de Inversiones</h1>
			
			<div class="row">
				<div class="col-md-3">
					<div class="card card-menu">
						<a href="/inversiones/proyecto">
							<i class="bi bi-briefcase"></i> Proyectos
						</a>
					</div>
				</div>
				<div class="col-md-3">
					<div class="card card-menu">
						<a href="/inversiones/proyecto/importCsv">
							<i class="bi bi-briefcase"></i> Importar CSV
						</a>
					</div>
				</div>
				<div class="col-md-3">
					<div class="card card-menu">
						<a href="/inversiones/rendimiento">
							<i class="bi bi-graph-up"></i> Rendimientos
						</a>
					</div>
				</div>
				<div class="col-md-3">
					<div class="card card-menu">
						<a href="/inversiones/tipoRendimiento">
							<i class="bi bi-tag"></i> Tipos de Rendimiento
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
