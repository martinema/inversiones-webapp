<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Proyecto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            padding-top: 20px;
        }
        .form-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
        }
        .btn-guardar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>💼 Proyecto</h1>
            <a href="/inversiones/proyecto" class="btn btn-secondary">← Volver</a>
        </div>
        
        <form th:action="@{/proyecto/guardar}" method="POST" th:object="${proyecto}">
            <input type="hidden" th:field="*{id}">
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="inmueble" class="form-label">Inmueble *</label>
                    <input type="text" class="form-control" id="inmueble" th:field="*{inmueble}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="moneda" class="form-label">Moneda *</label>
                    <input type="text" class="form-control" id="moneda" th:field="*{moneda}" placeholder="EUR, USD..." required>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="idTipoRendimiento" class="form-label">Tipo de Rendimiento *</label>
                    <select class="form-control" id="idTipoRendimiento" th:field="*{idTipoRendimiento}" required>
                        <option value="">Seleccionar tipo...</option>
                        <option th:each="tipo : ${tiposRendimiento}" th:value="${tipo.id}" th:text="${tipo.tipo}"></option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="estado" class="form-label">Estado</label>
                    <input type="text" class="form-control" id="estado" th:field="*{estado}" placeholder="Activo, Inactivo...">
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="duracion" class="form-label">Duración (meses)</label>
                    <input type="number" class="form-control" id="duracion" th:field="*{duracion}">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="estatus" class="form-label">Estatus</label>
                    <input type="text" class="form-control" id="estatus" th:field="*{estatus}">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="numeroTokens" class="form-label">Número de Tokens</label>
                    <input type="number" step="0.01" class="form-control" id="numeroTokens" th:field="*{numeroTokens}">
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="importeInversionEur" class="form-label">Importe Inversión EUR (€)</label>
                    <input type="number" step="0.01" class="form-control" id="importeInversionEur" th:field="*{importeInversionEur}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="importeInversionDol" class="form-label">Importe Inversión DOL ($)</label>
                    <input type="number" step="0.01" class="form-control" id="importeInversionDol" th:field="*{importeInversionDol}">
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-3 mb-3">
                    <label for="fechaEntrada" class="form-label">Fecha Entrada</label>
                    <input type="date" class="form-control" id="fechaEntrada" th:field="*{fechaEntrada}">
                </div>
                <div class="col-md-3 mb-3">
                    <label for="fechaCierre" class="form-label">Fecha Cierre</label>
                    <input type="date" class="form-control" id="fechaCierre" th:field="*{fechaCierre}">
                </div>
                <div class="col-md-3 mb-3">
                    <label for="fechaFin" class="form-label">Fecha Fin</label>
                    <input type="date" class="form-control" id="fechaFin" th:field="*{fechaFin}">
                </div>
                <div class="col-md-3 mb-3">
                    <label for="fechaInicioRenta" class="form-label">Fecha Inicio Renta</label>
                    <input type="date" class="form-control" id="fechaInicioRenta" th:field="*{fechaInicioRenta}">
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-3 mb-3">
                    <label for="rentabilidadAnualReentel" class="form-label">Rentabilidad Anual (%)</label>
                    <input type="number" class="form-control" id="rentabilidadAnualReentel" th:field="*{rentabilidadAnualReentel}">
                </div>
                <div class="col-md-3 mb-3">
                    <label for="rentabilidadAnualReentelPro" class="form-label">Rentabilidad Anual Pro (%)</label>
                    <input type="number" class="form-control" id="rentabilidadAnualReentelPro" th:field="*{rentabilidadAnualReentelPro}">
                </div>
                <div class="col-md-3 mb-3">
                    <label for="rentabilidadAnualReentelSuper" class="form-label">Rentabilidad Anual Super (%)</label>
                    <input type="number" class="form-control" id="rentabilidadAnualReentelSuper" th:field="*{rentabilidadAnualReentelSuper}">
                </div>
                <div class="col-md-3 mb-3">
                    <label for="colateralizable" class="form-label">Colateralizable</label>
                    <select class="form-control" id="colateralizable" th:field="*{colateralizable}">
                        <option value="">Seleccionar...</option>
                        <option value="true">Sí</option>
                        <option value="false">No</option>
                    </select>
                </div>
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-guardar">💾 Guardar</button>
                <a href="/inversiones/proyecto" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
