<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Importar CSV</title>
  <style>
    body {
      font-family: sans-serif;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input[type="file"] {
      margin-bottom: 10px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #3e8e41;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Importar CSV</h1>

    <form th:action="@{/api/proyectos/importar-csv}" method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label for="csvFile">Archivo CSV:</label>
        <input type="file" id="csvFile" name="csvFile" accept=".csv">
      </div>

      <button type="submit">Importar</button>
    </form>

    <div th:if="${error}" class="error">
      <p th:text="${error}"></p>
    </div>

    <div th:if="${success}" class="success">
      <p th:text="${success}"></p>
    </div>
  </div>

</body>
</html>
