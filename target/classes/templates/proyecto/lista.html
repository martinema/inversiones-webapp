<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link href="css/tabla.css" rel="stylesheet">
<th:block th:include="menu :: styles"></th:block>
<style>
.table-container {
	background: white;
	border-radius: 10px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
	padding: 20px;
}

h1 {
	color: #667eea;
	margin-bottom: 30px;
}

.btn-nuevo {
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	border: none;
	color: white;
	font-weight: bold;
}

.btn-nuevo:hover {
	color: white;
	transform: scale(1.05);
}

.table-hover tbody tr:hover {
	background-color: #f0f0f0 !important;
}

.table-responsive {
	overflow-x: auto;
}

@media ( max-width : 768px) {
	.table-container {
		padding: 15px;
	}
	.btn-nuevo {
		display: block;
		width: 100%;
		margin-bottom: 10px;
	}
	.table {
		font-size: 12px;
	}
	.table th, .table td {
		padding: 8px 5px;
	}
}

@media ( max-width : 576px) {
	.table-container {
		padding: 10px;
	}
	.d-flex {
		flex-direction: column;
	}
	h1 {
		font-size: 20px;
		margin-bottom: 15px;
	}
}
</style>
</head>
<body>
	<!-- Navigation Bar -->
	<div th:include="menu :: sidebar"></div>

	<!-- Content -->
	<div class="content">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1>💼 Proyectos</h1>
		</div>

		<div class="table-container">
			<div class="mb-3 d-flex flex-wrap gap-2">
				<a href="/inversiones/proyecto/nuevo"
					class="btn btn-nuevo flex-grow-1">+ Nuevo Proyecto</a> <a
					href="/inversiones/proyecto/importCsv"
					class="btn btn-nuevo flex-grow-1">📥 Importar CSV</a>
			</div>

			<div th:if="${proyectos.isEmpty()}" class="alert alert-info">
				No hay proyectos registrados</div>

			<div th:if="${!proyectos.isEmpty()}">
				<div class="table-actions">
					<button class="btn btn-delete-multiple"
						onclick="deleteSelected('proyectosTable', '/inversiones/proyecto/eliminarSeleccionados', 'proyecto')"
						id="btnDeleteMultiple">🗑️ Eliminar Seleccionados</button>
					<span class="selected-count hidden" id="selectedCount"></span>
				</div>

				<div class="table-responsive">
					<table class="table table-striped table-hover table-sm"
						id="proyectosTable">
						<thead class="table-dark">
							<tr>
								<th class="checkbox-column" style="width: 1%"><input
									type="checkbox" id="proyectosTable-selectAll"></th>
								<th data-column="inmueble">Inmueble</th>
								<th data-column="moneda">Moneda</th>
								<th data-column="tipoRendimiento">Tipo Rendimiento</th>
								<th data-column="estado">Estado</th>
								<th data-column="duracion">Duración</th>
								<th data-column="fechaEntrada">Fecha Entrada</th>
								<th data-column="fechaCierre">Fecha Cierre</th>
								<th data-column="fechaFin">Fecha Fin</th>
								<th data-column="fechaInicioRenta">Fecha Inicio Renta</th>
								<th data-column="porcentaje">% Mensual</th>
								<th data-column="porcentajeAnual">% Anual</th>
								<th data-column="porcentajeTotal">% Total</th>
								<th data-column="inversionEur">Inversión EUR</th>
								<th data-column="inversionDol">Inversión DOL</th>
								<th style="width: 1%">Acciones</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="proyecto : ${proyectos}">
								<td class="checkbox-column"><input type="checkbox"
									th:value="${proyecto.id}"></td>
								<!--                                 <td data-column="id" th:text="${proyecto.id}"></td> -->
								<td data-column="inmueble" th:text="${proyecto.inmueble}"></td>
								<td data-column="moneda" th:text="${proyecto.moneda}"></td>
								<td data-column="tipoRendimiento"
									th:text="${proyecto.tipoRendimiento != null ? proyecto.tipoRendimiento.tipo : 'N/A'}"></td>
								<td data-column="estado" th:text="${proyecto.estado}"></td>
								<td data-column="duracion" th:text="${proyecto.duracion}"></td>
								<td data-column="fechaEntrada"
									th:text="${proyecto.fechaEntrada}"></td>
								<td data-column="fechaCierre" th:text="${proyecto.fechaCierre}"></td>
								<td data-column="fechaFin" th:text="${proyecto.fechaFin}"></td>
								<td data-column="fechaInicioRenta"
									th:text="${proyecto.fechaInicioRenta}"></td>
								<!-- % según estatus -->
								<td data-column="porcentaje" th:if="${proyecto.estatus == 'SR'}"
									th:text="${proyecto.rentabilidadMensualReentelSuper}"></td>
								<td data-column="porcentaje"
									th:if="${proyecto.estatus == 'PRO'}"
									th:text="${proyecto.rentabilidadMensualReentelPro}"></td>
								<td data-column="porcentaje"
									th:if="${proyecto.estatus != 'SR' and proyecto.estatus != 'PRO'}"
									th:text="${proyecto.rentabilidadMensualReentel}"></td>
								<td data-column="porcentajeAnual"
									th:if="${proyecto.estatus == 'SR'}"
									th:text="${proyecto.rentabilidadAnualReentelSuper}"></td>
								<td data-column="porcentajeAnual"
									th:if="${proyecto.estatus == 'PRO'}"
									th:text="${proyecto.rentabilidadAnualReentelPro}"></td>
								<td data-column="porcentajeAnual"
									th:if="${proyecto.estatus != 'SR' and proyecto.estatus != 'PRO'}"
									th:text="${proyecto.rentabilidadAnualReentel}"></td>
								<td data-column="porcentajeTotal"
									th:if="${proyecto.estatus == 'SR'}"
									th:text="${proyecto.rentabilidadTotalReentelSuper}"></td>
								<td data-column="porcentajeTotal"
									th:if="${proyecto.estatus == 'PRO'}"
									th:text="${proyecto.rentabilidadTotalReentelPro}"></td>
								<td data-column="porcentajeTotal"
									th:if="${proyecto.estatus != 'SR' and proyecto.estatus != 'PRO'}"
									th:text="${proyecto.rentabilidadTotalReentel}"></td>
								<!-- Fin % según estatus -->
								<td data-column="inversionEur"
									th:text="${proyecto.importeInversionEur}"></td>
								<td data-column="inversionDol"
									th:text="${proyecto.importeInversionDol}"></td>
								<td><a
									th:href="@{/proyecto/editar/{id}(id=${proyecto.id})}"
									class="btn btn-warning btn-sm">Editar</a> <a
									th:href="@{/proyecto/eliminar/{id}(id=${proyecto.id})}"
									class="btn btn-danger btn-sm"
									onclick="return confirm('¿Estás seguro?')">Eliminar</a></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="js/tabla.js"></script>
	<script>
        document.addEventListener('DOMContentLoaded', function() {
            initTable('proyectosTable');
            
            // Actualizar contador de seleccionados
            const table = document.getElementById('proyectosTable');
            const checkboxes = table.querySelectorAll('tbody input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    updateSelectedCount('proyectosTable');
                });
            });
        });

        function updateSelectedCount(tableId) {
            const selectedIds = getSelectedIds(tableId);
            const countElement = document.getElementById('selectedCount');
            
            if (selectedIds.length > 0) {
                countElement.textContent = selectedIds.length + ' registro(s) seleccionado(s)';
                countElement.classList.remove('hidden');
            } else {
                countElement.classList.add('hidden');
            }
        }
    </script>

	<!-- Sidebar Toggle Script -->
	<script>
    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        if (sidebar) {
            sidebar.classList.toggle('active');
            if (overlay) overlay.classList.toggle('active');
            if (window.innerWidth <= 768) {
                if (sidebar.classList.contains('active')) {
                    document.body.style.overflow = 'hidden';
                    document.addEventListener('click', closeOnClickOutside);
                } else {
                    document.body.style.overflow = 'auto';
                    document.removeEventListener('click', closeOnClickOutside);
                }
            }
        }
    }

    function closeOnClickOutside(event) {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        const toggleOpen = document.querySelector('.sidebar-toggle-open');
        const toggleClose = document.querySelector('.sidebar-toggle-close');
        if (sidebar && !sidebar.contains(event.target) && !toggleOpen.contains(event.target) && !toggleClose.contains(event.target)) {
            sidebar.classList.remove('active');
            if (overlay) overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
            document.removeEventListener('click', closeOnClickOutside);
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (window.innerWidth <= 768) {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar) {
                sidebar.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }
        const sidebarLinks = document.querySelectorAll('.sidebar-menu a');
        sidebarLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    const sidebar = document.querySelector('.sidebar');
                    if (sidebar) {
                        sidebar.classList.remove('active');
                        document.body.style.overflow = 'auto';
                        document.removeEventListener('click', closeOnClickOutside);
                    }
                }
            });
        });
        window.addEventListener('resize', function() {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar && window.innerWidth > 768) {
                sidebar.classList.remove('active');
                document.body.style.overflow = 'auto';
                document.removeEventListener('click', closeOnClickOutside);
            }
        });
    });
    </script>
</body>
</html>
