<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            padding-top: 20px;
        }
        .table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
        }
        .btn-nuevo {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-weight: bold;
        }
        .btn-nuevo:hover {
            color: white;
            transform: scale(1.05);
        }
        .table-hover tbody tr:hover {
            background-color: #f0f0f0;
        }
        .table-responsive {
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center">
            <h1>💼 Proyectos</h1>
            <a href="/inversiones/" class="btn btn-secondary">← Volver</a>
        </div>
        
        <div class="table-container">
            <div class="mb-3">
                <a href="/inversiones/proyecto/nuevo" class="btn btn-nuevo">+ Nuevo Proyecto</a>
            </div>
            
            <div th:if="${proyectos.isEmpty()}" class="alert alert-info">
                No hay proyectos registrados
            </div>
            
            <div th:if="${!proyectos.isEmpty()}" class="table-responsive">
                <table class="table table-striped table-hover table-sm">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Inmueble</th>
                            <th>Moneda</th>
                            <th>Tipo Rendimiento</th>
                            <th>Estado</th>
                            <th>Duración</th>
                            <th>Inversión EUR</th>
                            <th>Inversión DOL</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="proyecto : ${proyectos}">
                            <td th:text="${proyecto.id}"></td>
                            <td th:text="${proyecto.inmueble}"></td>
                            <td th:text="${proyecto.moneda}"></td>
                            <td th:text="${proyecto.tipoRendimiento != null ? proyecto.tipoRendimiento.tipo : 'N/A'}"></td>
                            <td th:text="${proyecto.estado}"></td>
                            <td th:text="${proyecto.duracion}"></td>
                            <td th:text="${proyecto.importeInversionEur}"></td>
                            <td th:text="${proyecto.importeInversionDol}"></td>
                            <td>
                                <a th:href="@{/inversiones/proyecto/editar/{id}(id=${proyecto.id})}" class="btn btn-warning btn-sm">Editar</a>
                                <a th:href="@{/inversiones/proyecto/eliminar/{id}(id=${proyecto.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
