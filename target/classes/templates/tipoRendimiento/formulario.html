<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Tipo de Rendimiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            padding-top: 20px;
        }
        .form-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
        }
        .btn-guardar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-weight: bold;
            width: 100%;
        }
        .btn-volver {
            background: #6c757d;
            color: white;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>📝 Tipo de Rendimiento</h1>
            <a href="/inversiones/tipoRendimiento" class="btn btn-secondary">← Volver</a>
        </div>
        
        <form th:action="@{/tipoRendimiento/guardar}" method="POST" th:object="${tipoRendimiento}">
            <input type="hidden" th:field="*{id}">
            
            <div class="mb-3">
                <label for="tipo" class="form-label">Tipo de Rendimiento *</label>
                <input type="text" class="form-control" id="tipo" th:field="*{tipo}" placeholder="Ej: Interés, Dividendo..." required>
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-guardar">💾 Guardar</button>
                <a href="/inversiones/tipoRendimiento" class="btn btn-volver">Cancelar</a>
            </div>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
