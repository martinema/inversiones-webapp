<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Rendimiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/tabla.css" rel="stylesheet">
    <th:block th:include="menu :: styles"></th:block>
    <style>
.table-container {
    background: white;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    padding: 20px;
}
h1 {
    color: #667eea;
    margin-bottom: 30px;
}
.btn-nuevo {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    color: white;
    font-weight: bold;
}
.btn-nuevo:hover {
    color: white;
    transform: scale(1.05);
}
.table-hover tbody tr:hover {
    background-color: #f0f0f0 !important;
}
    </style>
</head>
<body>
	<!-- Sidebar -->
	<div th:include="menu :: sidebar" class="sidebar"></div>

	<!-- Content -->
	<div class="content">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1>📋 Tipos de Rendimiento</h1>
		</div>
        
        <div class="table-container">
            <div class="mb-3">
                <a href="/inversiones/tipoRendimiento/nuevo" class="btn btn-nuevo">+ Nuevo Tipo de Rendimiento</a>
            </div>
            
            <div th:if="${tiposRendimiento.isEmpty()}" class="alert alert-info">
                No hay tipos de rendimiento registrados
            </div>
            
            <div th:if="${!tiposRendimiento.isEmpty()}">
                <div class="table-actions">
                    <button class="btn btn-delete-multiple" onclick="deleteSelected('tiposTable', '/inversiones/tipoRendimiento/eliminarSeleccionados', 'tipo de rendimiento')" id="btnDeleteMultiple">
                        🗑️ Eliminar Seleccionados
                    </button>
                    <span class="selected-count hidden" id="selectedCount"></span>
                </div>

                <table class="table table-striped table-hover" id="tiposTable">
                    <thead class="table-dark">
                        <tr>
                            <th class="checkbox-column" style="width: 1%">
                                <input type="checkbox" id="tiposTable-selectAll">
                            </th>
                            <th data-column="id" style="width: 1%">ID</th>
                            <th data-column="tipo">Tipo</th>
                            <th data-column="periodo" style="width: 10%">Período (meses)</th>
                            <th style="width: 1%">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="tipo : ${tiposRendimiento}">
                            <td class="checkbox-column">
                                <input type="checkbox" th:value="${tipo.id}">
                            </td>
                            <td data-column="id" th:text="${tipo.id}"></td>
                            <td data-column="tipo" th:text="${tipo.tipo}"></td>
                            <td data-column="periodo" th:text="${tipo.periodo}"></td>
                            <td>
                                <a th:href="@{/tipoRendimiento/editar/{id}(id=${tipo.id})}" class="btn btn-warning btn-sm">Editar</a>
                                <a th:href="@{/tipoRendimiento/eliminar/{id}(id=${tipo.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
	</div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/tabla.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initTable('tiposTable');
            
            // Actualizar contador de seleccionados
            const table = document.getElementById('tiposTable');
            const checkboxes = table.querySelectorAll('tbody input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    updateSelectedCount('tiposTable');
                });
            });
        });

        function updateSelectedCount(tableId) {
            const selectedIds = getSelectedIds(tableId);
            const countElement = document.getElementById('selectedCount');
            
            if (selectedIds.length > 0) {
                countElement.textContent = selectedIds.length + ' registro(s) seleccionado(s)';
                countElement.classList.remove('hidden');
            } else {
                countElement.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
