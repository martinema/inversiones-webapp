<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/tabla.css" rel="stylesheet">
    <th:block th:include="menu :: styles"></th:block>
    <style>
.table-container {
    background: white;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    padding: 20px;
}
h1 {
    color: #667eea;
    margin-bottom: 30px;
}
.btn-nuevo {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    color: white;
    font-weight: bold;
}
.btn-nuevo:hover {
    color: white;
    transform: scale(1.05);
}
.table-hover tbody tr:hover {
    background-color: #f0f0f0 !important;
}
.table-responsive {
    overflow-x: auto;
}
    </style>
</head>
<body>
	<!-- Sidebar -->
	<div th:include="menu :: sidebar" class="sidebar"></div>

	<!-- Content -->
	<div class="content">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1>📈 Rendimientos</h1>
		</div>
        
        <div class="table-container">
            <div class="mb-3">
                <a href="/inversiones/rendimiento/nuevo" class="btn btn-nuevo">+ Nuevo Rendimiento</a>
                <a href="/inversiones/rendimiento/importCsv" class="btn btn-nuevo">📥 Importar CSV</a>
                <a href="/inversiones/rendimiento/resumenMensual" class="btn btn-nuevo">📊 Resumen Mensual</a>
                <a href="/inversiones/rendimiento/estimacionMensual" class="btn btn-nuevo">📅 Estimación Mensual</a>
            </div>
            
            <div th:if="${rendimientos.isEmpty()}" class="alert alert-info">
                No hay rendimientos registrados
            </div>
            
            <div th:if="${!rendimientos.isEmpty()}">
                <div class="table-actions">
                    <button class="btn btn-delete-multiple" onclick="deleteSelected('rendimientosTable', '/inversiones/rendimiento/eliminarSeleccionados', 'rendimiento')" id="btnDeleteMultiple">
                        🗑️ Eliminar Seleccionados
                    </button>
                    <span class="selected-count hidden" id="selectedCount"></span>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover table-sm" id="rendimientosTable">
                        <thead class="table-dark">
                            <tr>
                                <th class="checkbox-column" style="width: 1%">
                                    <input type="checkbox" id="rendimientosTable-selectAll">
                                </th>
<!--                                 <th data-column="id">ID</th> -->
                                <th data-column="dividend">Dividend</th>
                                <th data-column="hashid">Hash ID</th>
                                <th data-column="wallet">Wallet</th>
                                <th data-column="distributed">Distribuido</th>
                                <th data-column="retained">Retenido</th>
                                <th data-column="reinvested">Reinvertido</th>
                                <th data-column="claimed">Reclamado</th>
                                <th data-column="date">Fecha</th>
                                <th style="width: 1%">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="rendimiento : ${rendimientos}">
                                <td class="checkbox-column">
                                    <input type="checkbox" th:value="${rendimiento.id}">
                                </td>
<!--                                 <td data-column="id" th:text="${rendimiento.id}"></td> -->
                                <td data-column="dividend" th:text="${#strings.substring(rendimiento.dividend,0,#strings.indexOf(rendimiento.dividend,'#'))}"></td>
                                <td data-column="hashid"> <span th:text="${rendimiento.hashid}" th:title="${rendimiento.hashid}" class="texto-recortado"></span></td>
                                <td data-column="wallet"><span th:text="${rendimiento.wallet}" th:title="${rendimiento.wallet}" class="texto-recortado"></span></td>
                                <td data-column="distributed" th:text="${rendimiento.distributed}"></td>
                                <td data-column="retained" th:text="${rendimiento.retained}"></td>
                                <td data-column="reinvested" th:text="${rendimiento.reinvested}"></td>
                                <td data-column="claimed" th:text="${rendimiento.claimed}"></td>
                                <td data-column="date" th:text="${rendimiento.date}"></td>
                                <td>
                                    <a th:href="@{/rendimiento/editar/{id}(id=${rendimiento.id})}" class="btn btn-warning btn-sm">Editar</a>
                                    <a th:href="@{/rendimiento/eliminar/{id}(id=${rendimiento.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
	</div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/tabla.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initTable('rendimientosTable');
            
            // Actualizar contador de seleccionados
            const table = document.getElementById('rendimientosTable');
            const checkboxes = table.querySelectorAll('tbody input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    updateSelectedCount('rendimientosTable');
                });
            });
        });

        function updateSelectedCount(tableId) {
            const selectedIds = getSelectedIds(tableId);
            const countElement = document.getElementById('selectedCount');
            
            if (selectedIds.length > 0) {
                countElement.textContent = selectedIds.length + ' registro(s) seleccionado(s)';
                countElement.classList.remove('hidden');
            } else {
                countElement.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
