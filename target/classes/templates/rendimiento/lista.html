<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            padding-top: 20px;
        }
        .table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
        }
        .btn-nuevo {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-weight: bold;
        }
        .btn-nuevo:hover {
            color: white;
            transform: scale(1.05);
        }
        .table-hover tbody tr:hover {
            background-color: #f0f0f0;
        }
        .table-responsive {
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center">
            <h1>📈 Rendimientos</h1>
            <a href="/inversiones/" class="btn btn-secondary">← Volver</a>
        </div>
        
        <div class="table-container">
            <div class="mb-3">
                <a href="/inversiones/rendimiento/nuevo" class="btn btn-nuevo">+ Nuevo Rendimiento</a>
            </div>
            
            <div th:if="${rendimientos.isEmpty()}" class="alert alert-info">
                No hay rendimientos registrados
            </div>
            
            <div th:if="${!rendimientos.isEmpty()}" class="table-responsive">
                <table class="table table-striped table-hover table-sm">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Dividend</th>
                            <th>Hash ID</th>
                            <th>Wallet</th>
                            <th>Distribuido</th>
                            <th>Retenido</th>
                            <th>Reinvertido</th>
                            <th>Reclamado</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="rendimiento : ${rendimientos}">
                            <td th:text="${rendimiento.id}"></td>
                            <td th:text="${rendimiento.dividend}"></td>
                            <td th:text="${rendimiento.hashid}"></td>
                            <td th:text="${rendimiento.wallet}"></td>
                            <td th:text="${rendimiento.distributed}"></td>
                            <td th:text="${rendimiento.retained}"></td>
                            <td th:text="${rendimiento.reinvested}"></td>
                            <td th:text="${rendimiento.claimed}"></td>
                            <td th:text="${rendimiento.date}"></td>
                            <td>
                                <a th:href="@{/rendimiento/editar/{id}(id=${rendimiento.id})}" class="btn btn-warning btn-sm">Editar</a>
                                <a th:href="@{/rendimiento/eliminar/{id}(id=${rendimiento.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
