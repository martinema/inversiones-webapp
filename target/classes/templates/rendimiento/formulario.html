<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Rendimiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:include="menu :: styles"></th:block>
    <style>
.form-container {
	background: white;
	border-radius: 10px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
	padding: 30px;
	max-width: 900px;
}

h1 {
	color: #667eea;
	margin-bottom: 30px;
}

.btn-guardar {
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	border: none;
	color: white;
	font-weight: bold;
	width: 100%;
}

.btn-guardar:hover {
	background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
	color: white;
}

@media (max-width: 768px) {
	.form-container {
		padding: 20px;
		max-width: 100%;
	}
	
	h1 {
		font-size: 22px;
		margin-bottom: 20px;
	}
	
	.col-md-6 {
		padding: 5px;
	}
	
	.col-md-3 {
		padding: 5px;
	}
}

@media (max-width: 576px) {
	.form-container {
		padding: 15px;
	}
	
	h1 {
		font-size: 18px;
	}
	
	.row {
		margin-right: -5px;
		margin-left: -5px;
	}
}
    </style>
</head>
<body>
	<!-- Navigation Bar -->
	<div th:include="menu :: sidebar"></div>

	<!-- Content -->
	<div class="content">
		<div class="form-container">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<h1>📊 Rendimiento</h1>
			</div>
        
        <form th:action="@{/rendimiento/guardar}" method="POST" th:object="${rendimiento}">
            <input type="hidden" th:field="*{id}">
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="dividend" class="form-label">Dividend</label>
                    <input type="text" class="form-control" id="dividend" th:field="*{dividend}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="hashid" class="form-label">Hash ID</label>
                    <input type="text" class="form-control" id="hashid" th:field="*{hashid}">
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="wallet" class="form-label">Wallet</label>
                    <input type="text" class="form-control" id="wallet" th:field="*{wallet}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="date" class="form-label">Fecha</label>
                    <input type="date" class="form-control" id="date" th:field="*{date}">
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-3 mb-3">
                    <label for="distributed" class="form-label">Distribuido</label>
                    <input type="number" step="0.0000001" class="form-control" id="distributed" th:field="*{distributed}">
                </div>
                <div class="col-md-3 mb-3">
                    <label for="retained" class="form-label">Retenido</label>
                    <input type="number" step="0.0000001" class="form-control" id="retained" th:field="*{retained}">
                </div>
                <div class="col-md-3 mb-3">
                    <label for="reinvested" class="form-label">Reinvertido</label>
                    <input type="number" step="0.0000001" class="form-control" id="reinvested" th:field="*{reinvested}">
                </div>
                <div class="col-md-3 mb-3">
                    <label for="claimed" class="form-label">Reclamado</label>
                    <input type="number" step="0.0000001" class="form-control" id="claimed" th:field="*{claimed}">
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="claims" class="form-label">Claims (JSON)</label>
                    <textarea class="form-control" id="claims" th:field="*{claims}" rows="4" placeholder="{}"></textarea>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="reinvests" class="form-label">Reinvests (JSON)</label>
                    <textarea class="form-control" id="reinvests" th:field="*{reinvests}" rows="4" placeholder="{}"></textarea>
                </div>
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-guardar">💾 Guardar</button>
                <a href="/inversiones/rendimiento" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
		</div>
	</div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Sidebar Toggle Script -->
    <script>
    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        if (sidebar) {
            sidebar.classList.toggle('active');
            if (overlay) overlay.classList.toggle('active');
            if (window.innerWidth <= 768) {
                if (sidebar.classList.contains('active')) {
                    document.body.style.overflow = 'hidden';
                    document.addEventListener('click', closeOnClickOutside);
                } else {
                    document.body.style.overflow = 'auto';
                    document.removeEventListener('click', closeOnClickOutside);
                }
            }
        }
    }
    function closeOnClickOutside(event) {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        const toggleOpen = document.querySelector('.sidebar-toggle-open');
        const toggleClose = document.querySelector('.sidebar-toggle-close');
        if (sidebar && !sidebar.contains(event.target) && !toggleOpen.contains(event.target) && !toggleClose.contains(event.target)) {
            sidebar.classList.remove('active');
            if (overlay) overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
            document.removeEventListener('click', closeOnClickOutside);
        }
    }
    document.addEventListener('DOMContentLoaded', function() {
        if (window.innerWidth <= 768) {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar) {
                sidebar.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }
        const sidebarLinks = document.querySelectorAll('.sidebar-menu a');
        sidebarLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    const sidebar = document.querySelector('.sidebar');
                    if (sidebar) {
                        sidebar.classList.remove('active');
                        document.body.style.overflow = 'auto';
                        document.removeEventListener('click', closeOnClickOutside);
                    }
                }
            });
        });
        window.addEventListener('resize', function() {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar && window.innerWidth > 768) {
                sidebar.classList.remove('active');
                document.body.style.overflow = 'auto';
                document.removeEventListener('click', closeOnClickOutside);
            }
        });
    });
    </script>
</body>
</html>
