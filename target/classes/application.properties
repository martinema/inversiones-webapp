# Configuración de la Base de Datos H2 (en memoria)
##spring.datasource.url=jdbc:h2:mem:inversiones
spring.datasource.url=jdbc:h2:file:./data/inversiones
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Configuración de JPA/Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilitar consola H2 (opcional, útil para desarrollo)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
spring.h2.console.path=/h2-console

# Configuración adicional recomendada
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Puerto de la aplicación
server.port=8080

# Contexto de la aplicación
server.servlet.context-path=/inversiones

# Configuración de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.root=ERROR
logging.level.com.inversiones=DEBUG
